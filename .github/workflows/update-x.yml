name: Update X posts

# 1時間ごと、および x-posts.txt を書き換えたときにXの投稿を取り込み、変更があればサイトに反映する
# （X側の混雑で取得できない回が多いため、回数を多めにしている）
on:
  schedule:
    - cron: "17 * * * *"
  push:
    paths:
      - x-posts.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # X側の混雑で取得できない回があっても、前回の内容のまま次回に再挑戦する
      - run: node scripts/update-x.mjs
        continue-on-error: true
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Update X posts"
            git push
          fi
